<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Exact gradient from ic_launcher_background.xml -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#1a9e8f"/>
      <stop offset="1"   stop-color="#1565c0"/>
    </linearGradient>
    <!-- Rounded rectangle clip for icon shape -->
    <clipPath id="icon-clip">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Card stack: centered at (256,256), scaled 0.85 — matches Android XML exactly -->
  <g transform="translate(256,256) scale(0.85,0.85)">

    <!-- Back card: rotation=-14, translateY=+15, alpha=0.55, fill=#e0f2f1 -->
    <g transform="translate(0,15) rotate(-14)" opacity="0.55">
      <path fill="#e0f2f1"
            d="M-122,-95 L122,-95 A18,18 0 0 1 140,-77 L140,77
               A18,18 0 0 1 122,95 L-122,95
               A18,18 0 0 1 -140,77 L-140,-77
               A18,18 0 0 1 -122,-95 Z"/>
    </g>

    <!-- Middle card: rotation=+7, translateY=+2, alpha=0.75, fill=#b2dfdb -->
    <g transform="translate(0,2) rotate(7)" opacity="0.75">
      <path fill="#b2dfdb"
            d="M-122,-95 L122,-95 A18,18 0 0 1 140,-77 L140,77
               A18,18 0 0 1 122,95 L-122,95
               A18,18 0 0 1 -140,77 L-140,-77
               A18,18 0 0 1 -122,-95 Z"/>
    </g>

    <!-- Front card: translateY=-18, white -->
    <g transform="translate(0,-18)">
      <path fill="#ffffff"
            d="M-122,-95 L122,-95 A18,18 0 0 1 140,-77 L140,77
               A18,18 0 0 1 122,95 L-122,95
               A18,18 0 0 1 -140,77 L-140,-77
               A18,18 0 0 1 -122,-95 Z"/>

      <!-- 记 character — same color/alpha as original 汉 -->
      <text x="0" y="42"
            font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="148"
            font-weight="500"
            fill="#1565c0"
            fill-opacity="0.92"
            text-anchor="middle"
            dominant-baseline="auto">学</text>

      <!-- Pop-cue dots (exact positions from XML) -->
      <circle cx="-20" cy="72" r="5" fill="#1a9e8f" fill-opacity="0.5"/>
      <circle cx="0"   cy="72" r="5" fill="#1a9e8f" fill-opacity="0.7"/>
      <circle cx="20"  cy="72" r="5" fill="#1a9e8f" fill-opacity="0.5"/>
    </g>

  </g>
</svg>
